name: Publica a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplega:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Sense aquest segell, sw.js no canviaria mai i els mòbils que ja tinguin
      # l'app instal·lada es quedarien per sempre amb la versió antiga.
      - name: Segella la versió del servei de fons
        run: |
          sed -i "s/^const VERSIO = 'dev';/const VERSIO = '${GITHUB_SHA:0:7}';/" sw.js
          grep -n "^const VERSIO" sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: desplegament
        uses: actions/deploy-pages@v4
